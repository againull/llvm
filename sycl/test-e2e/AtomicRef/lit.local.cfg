# %{full_atomic_flags} are the extra flags needed for full atomic coverage
# (16/32/64-bit). Tests build a second binary with them
# unconditionally (per-device features are not available on build lines) and
# select it per device using aspect checks, see e.g. max.cpp. The width-specific
# variants let large tests split the coverage across separate translation units.
# Half tests require atomic16 and fp16; double tests require atomic64 and fp64.
# Native CPU uses no extra flags because it cannot compile bfloat16 atomics.
# Only SPIR builds use the translator; other targets reject its flags with -Werror.
def add_full_atomic_flags(name, defines):
    config.substitutions.append(
        (
            name,
            "%if target-spir %{ "
            f"{defines} -fsycl-device-code-split=per_kernel "
            "-Xspirv-translator=spir64 "
            "-spirv-ext=+SPV_KHR_bfloat16,+SPV_INTEL_16bit_atomics "
            "%} %else %{ %}",
        )
    )


add_full_atomic_flags("%{full_atomic16_flags}", "-DFULL_ATOMIC16_COVERAGE")
add_full_atomic_flags("%{full_atomic32_flags}", "-DFULL_ATOMIC32_COVERAGE")
add_full_atomic_flags("%{full_atomic64_flags}", "-DFULL_ATOMIC64_COVERAGE")
add_full_atomic_flags(
    "%{full_atomic_flags}",
    "-DFULL_ATOMIC16_COVERAGE -DFULL_ATOMIC32_COVERAGE "
    "-DFULL_ATOMIC64_COVERAGE",
)
