# Full coverage includes 16-bit types that need translator SPIR-V extensions.
# Build it for SPIR translator configurations without checking device aspects.
# Other compiler configurations build and run baseline coverage instead.
# Width-specific 32/64-bit coverage does not need these extensions.
# Half tests require atomic16 and fp16; double tests require atomic64 and fp64.
def add_full_atomic_flags(name, defines):
    config.substitutions.append(
        (
            name,
            "%if target-spir && !spirv-backend %{ "
            f"{defines} -fsycl-device-code-split=per_kernel "
            "-Xspirv-translator=spir64 "
            "-spirv-ext=+SPV_KHR_bfloat16,+SPV_INTEL_16bit_atomics "
            "%} %else %{ %}",
        )
    )


add_full_atomic_flags("%{full_atomic16_flags}", "-DFULL_ATOMIC16_COVERAGE")
for width in (32, 64):
    config.substitutions.append(
        (
            f"%{{full_atomic{width}_flags}}",
            f"-DFULL_ATOMIC{width}_COVERAGE -fsycl-device-code-split=per_kernel",
        )
    )
add_full_atomic_flags(
    "%{full_atomic_flags}",
    "-DFULL_ATOMIC16_COVERAGE -DFULL_ATOMIC32_COVERAGE "
    "-DFULL_ATOMIC64_COVERAGE",
)

# A mixed-target baseline build may include CUDA/HIP or Native CPU. Compile
# the extended binary separately so its 16-bit types only reach SPIR.
config.substitutions.append(
    (
        "%{build_full_atomic}",
        "%if target-spir && !spirv-backend %{ "
        "%clangxx -fsycl -fsycl-targets=spir64 %verbose_print %s "
        "%{full_atomic_flags} "
        "%} %else %{ %{build} %}",
    )
)
